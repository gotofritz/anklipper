# Run `pre-commit install --install-hooks --hook-type commit-msg` once after
# cloning. CI runs the same hooks, so a clean commit here means a clean CI run.
default_install_hook_types: [pre-commit, commit-msg]

# .claude/ is vendored skills and plugin scripts. Never rewrite them —
# trailing spaces are a hard line break in Markdown, so "fixing" them
# changes how a skill renders.
exclude: ^\.claude/(skills|plugins)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        # caveman-*.sh are vendored skill scripts, not project code.
        exclude: ^\.claude/hooks/caveman-

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        # .claude/ is vendored skills and plugin docs; CLAUDE.md is a
        # one-line import directive, not a document.
        exclude: ^(\.claude/|CLAUDE\.md$)

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        # The Conventional Commits defaults. A pull request title is what
        # actually reaches main under squash merge, and this hook cannot see
        # it — see the Releases section of AGENTS.md.
        args:
          - build
          - chore
          - ci
          - docs
          - feat
          - fix
          - perf
          - refactor
          - revert
          - style
          - test

  # TypeScript and Svelte. `language: system` because these run the project's
  # own pnpm scripts — the same commands CI runs, so one green run means both.
  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        files: \.(ts|js|mjs|cjs|svelte|json|ya?ml|css|html)$
        exclude: ^\.claude/

      - id: eslint
        name: ESLint
        entry: pnpm exec eslint --fix
        language: system
        files: \.(ts|js|mjs|cjs|svelte)$
        exclude: ^\.claude/

      - id: vitest
        name: Vitest
        entry: pnpm test
        language: system
        files: \.(ts|js|mjs|cjs|svelte)$
        pass_filenames: false

  # The TDD gate's own tests. The gate blocks source modules with no test, so
  # a broken gate silently stops enforcing TDD.
  - repo: local
    hooks:
      - id: tdd-hook-tests
        name: TDD hook tests
        entry: bash .claude/hooks/test-check-tdd.sh
        language: system
        files: ^\.claude/hooks/
        pass_filenames: false
