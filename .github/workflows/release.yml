name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # Opens and maintains a release PR from the Conventional Commits on
      # main. Merging that PR is what cuts a release, so releasing stays a
      # deliberate act while the version and notes are derived, not typed.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  artifact:
    name: Attach extension build
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Read at the job level so the signing step can test them: the `secrets`
      # context is awkward in a step `if`, and `env` is not.
      WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
      WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Firefox refuses to install an unsigned add-on permanently, so the zip
      # alone is a build, not a release anyone can use. Signing is skipped
      # rather than failed when no AMO credentials are configured — the zips
      # still attach, and the developer guide says how to sign by hand.
      - name: Sign for distribution
        if: env.WEB_EXT_API_KEY != ''
        run: >-
          pnpm exec web-ext sign
          --source-dir .output/firefox-mv3
          --artifacts-dir .output
          --channel unlisted
          --upload-source-code .output/anklipper-*-sources.zip
      - name: Attach build to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          shopt -s nullglob
          gh release upload "$TAG" .output/*.zip .output/*.xpi --clobber
