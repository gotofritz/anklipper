name: CI

on:
  pull_request:
  push:
    branches: [main]

# A superseded run on the same branch is wasted compute; cancel it. Never
# cancel on main, where each run is the record for a merged commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The Prettier, ESLint, and Vitest hooks run the project's own scripts,
      # so the toolchain has to be installed before pre-commit runs.
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Same hooks a contributor runs locally, so green here means green there.
      - uses: pre-commit/action@v3.0.1

  build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      # Firefox is the target that ships (P5); Chrome only has to keep
      # compiling, so the port never becomes a rewrite.
      - run: pnpm build:chrome
